services:
  - type: web
    name: voice-interview-agent-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: azure_openai
      - key: AZURE_OPENAI_KEY
        sync: true
      - key: AZURE_OPENAI_ENDPOINT
        sync: true
      - key: AZURE_DEPLOYMENT_NAME
        value: gpt-4o-mini
      - key: GROQ_API_KEY
        sync: true
      - key: GOOGLE_AI_STUDIO_API_KEY
        sync: true
      - key: ELEVENLABS_API_KEY
        sync: true
      - key: PINECONE_API_KEY
        sync: true
      - key: PINECONE_INDEX
        value: ai-intern-qa
      - key: DEFAULT_LANGUAGE
        value: en
